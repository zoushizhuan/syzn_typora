#碰撞环境设置, 设置格式如下：
# collision_objects:
#   wall: #障碍物名称
#     type: "Box" #障碍类型
#     side_lengths: [0.1, 0.1, 3] #障碍在x，y，z方向的长度 单位：M
#     center_pose: [1.0292, 0.4429, 1.0062, 1, 0, 0, 0] #障碍中心位姿[x,y,z,1,0,0,0] 单位：M
# 建议单位统一为mm
collision_objects:
  long:
    type: Box
    side_lengths:
    - 5
    - 5
    - 5
    center_pose:
    - 0
    - 0
    - 0
    - 1
    - 0
    - 0
    - 0
app2d_adjust_threshold_x: 0
app2d_adjust_threshold_y: 0
app2d_adjust_threshold_a: 0
#最大矫正次数，超过数值会给3
max_correction_num: 1

#报错复位
# robot_monitor_enable(实时获取机器人状态) = ture 时，middleware会见识示教器报警状态
robot_monitor_enable: true
robot_error_handler:
  reset:
    error_id: []
    project: main
    program: QCumber_DB_SELECT
  collect_failure_case:
    error_id: []
enable_roboeye_timing_task: true
collision_threshold: 20

####################################################################################-
# 以下参数需要给默认值

manipulability_threshhold: 0.017
# 上方点到进攻点检测采样步长：步长越小，采样检测点越多，筛选越准确，检测速度越慢
sample_steplen_above_pose_to_pre_grasp: 0.03
# 进攻点到抓取点检测采样步长：步长越小，采样检测点越多，筛选越准确，检测速度越慢
sample_steplen_pre_grasp_to_grasp: 0.01

# 进攻方式：S —— 垂直移动到抓取点；Z —— 沿Z方向移动到抓取点
pre_grasp_mode: S   # 'S/Z/AUTO' -- '直下/沿Z方向/自动（根据抓取点位置自动选择SD/ZD， todo）'
# 撤退方式：S —— 垂直移动到撤退点；Z —— 沿Z方向移动到撤退点；AUTO ——根据v撤退区域参数自动选择
retreat_mode: S   # 'S/Z/AUTO' -- '直上/沿Z方向/自动（根据抓取点位置选择SU/ZU）'
# for grasp planner --end

# 过滤条件（按工件、按抓取点）
invalid_grasp_check_mode: object_id   #['object_id', 'grasp_id']
# 失败抓取点过滤距离阈值
invalid_grasp_filter_threshold: 25


#是否打印调试信息:关闭后, 不会输出 manipulability_threshhold等调试信
debugging: false

# 建议不要双重否定
disable_app2d: true

# 检测对象
bin_pc_variable_name: pc_0
# 框内最少点云数量， 小于该数量，且超过最大无抓取点设置，会发送推框信号（4）给机器人
bin_pc_min_count: 99999
# 最大无抓取点次数， 无抓取点次数超过该值会发送无抓取点信号（-1）给机器人
no_grasp_num_max: 1
# 触发移框信号的工件数量上限
move_bin_max_part_num: 1

# Debug
#启用机器人实时动作监控图形窗口
robot_monitor_vis_enable: false

#################################################################################
# 以下参数需要给默认值并且隐藏

#内置参数, 不需要现场更改, 下次更新隐藏
translations_scale: 0.001
log_file_path: /root/middleware/log
profile_log_on: false
print_profile_summary_only: true
update_bin: false
gripper_self_collision_check: true

# 以后应该和机器人绑定
rotation_mode: ZYX

rotation_as_degree: true
robot_debugging: true


